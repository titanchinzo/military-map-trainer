<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Тактикийн тэмдгийн сургалт</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #f4f4f5;
        font-family: "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #a1a1aa;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      button {
        border: 0;
        border-radius: 0.375rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #3b82f6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Интернэт холболт алга</h1>
      <p>
        Апп-ыг ачаалж чадсангүй. Интернэт холболтоо шалгаад дахин оролдоно уу.
        Холболт сэргэмэгц автоматаар дахин оролдоно.
      </p>
      <button id="retry" type="button">Дахин оролдох</button>
    </main>
    <script>
      const url = new URLSearchParams(location.search).get("url");
      function retry() {
        if (url && /^https?:\/\//i.test(url)) location.href = url;
      }
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
